<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>しょうぎクイズ道場</title>
<meta name="description" content="囲い・手筋・戦法・詰将棋を、パラパラ漫画とクイズでおぼえる将棋アプリ">
<meta name="theme-color" content="#101a2e">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="manifest" href="./app.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Shippori+Mincho+B1:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="app">

  <!-- ============ タイトル ============ -->
  <section class="screen is-active" id="screen-title">
    <div class="title-hero">
      <svg class="logo-koma" viewBox="0 0 100 106" aria-hidden="true">
        <defs>
          <linearGradient id="lg-wood" x1="0" y1="0" x2=".6" y2="1">
            <stop offset="0" stop-color="#fdeac2"/><stop offset=".55" stop-color="#f0cd8b"/><stop offset="1" stop-color="#d3a055"/>
          </linearGradient>
        </defs>
        <polygon points="50,3 84,19 95,101 5,101 16,19" fill="url(#lg-wood)" stroke="#7a4f26" stroke-width="3" stroke-linejoin="round"/>
        <polygon points="50,10 79,24 89,95 11,95 21,24" fill="none" stroke="#c99a54" stroke-width="1.5" stroke-linejoin="round"/>
        <text x="50" y="74" text-anchor="middle" font-size="48" fill="#3a2410" class="logo-kanji">王</text>
      </svg>
      <h1 class="title">しょうぎクイズ道場<span class="title-sub">かこい・てすじ・せんぽう</span></h1>
      <p class="tagline">クイズにこたえて <b>名人（めいじん）</b> をめざそう！</p>
      <p class="total-note" id="total-note">&nbsp;</p>
    </div>

    <div class="mode-list" id="mode-list"></div>

    <p class="credit">駒の動きと詰みは、アプリの中の将棋エンジンが計算しています。</p>
  </section>

  <!-- ============ クイズ ============ -->
  <section class="screen" id="screen-quiz">
    <div class="hud">
      <button class="icon-btn" id="btn-quit" type="button" aria-label="やめてタイトルへ">✕</button>
      <span class="hud-count" id="hud-count">第1問</span>
      <span class="hud-score">せいかい <b id="hud-score">0</b></span>
    </div>
    <div class="progress" id="progress" aria-hidden="true"></div>

    <div class="q-card">
      <p class="q-label" id="q-label"></p>
      <p class="q-text" id="q-text"></p>
      <div class="stage" id="stage" hidden></div>
      <div class="player" id="player" hidden>
        <div class="player-btns">
          <button class="ctrl" id="btn-play" type="button">▶ さいせい</button>
          <button class="ctrl ctrl-sm" id="btn-prev" type="button" aria-label="1手もどる">◀</button>
          <button class="ctrl ctrl-sm" id="btn-next-move" type="button" aria-label="1手すすむ">▶</button>
          <button class="ctrl ctrl-sm" id="btn-speed" type="button" aria-label="はやさ">×1</button>
        </div>
        <div class="kifu-strip" id="kifu-strip"></div>
      </div>
      <div class="hands" id="hands" hidden></div>
    </div>

    <div class="choices" id="choices"></div>
  </section>

  <!-- ============ 結果 ============ -->
  <section class="screen" id="screen-result">
    <div class="menjo">
      <div class="menjo-head">免　状</div>
      <div class="menjo-rank" id="result-rank">—</div>
      <div class="menjo-kana" id="result-kana"></div>
      <div class="menjo-stars" id="result-stars"></div>
      <div class="menjo-score"><b id="result-score">0</b> / <span id="result-total">10</span> 問せいかい</div>
      <p class="menjo-msg" id="result-msg"></p>
      <div class="menjo-seal" aria-hidden="true">道場</div>
    </div>
    <div class="review" id="review" hidden>
      <h2 class="review-title">まちがえたところ</h2>
      <ul class="review-list" id="review-list"></ul>
    </div>
    <div class="btn-col">
      <button class="big-btn" id="btn-retry" type="button">もういちど ちょうせん！</button>
      <button class="big-btn alt" id="btn-zukan-from-result" type="button">ずかんで ふくしゅう</button>
      <button class="big-btn alt" id="btn-home" type="button">モードを えらぶ</button>
    </div>
  </section>

  <!-- ============ ずかん ============ -->
  <section class="screen" id="screen-zukan">
    <div class="hud">
      <button class="icon-btn" id="btn-zukan-back" type="button" aria-label="タイトルへもどる">◀</button>
      <span class="hud-count">ずかん</span>
      <span class="hud-score" id="zukan-count"></span>
    </div>
    <div class="tabs" id="zukan-tabs">
      <button class="tab is-on" data-tab="castle" type="button">囲い</button>
      <button class="tab" data-tab="tesuji" type="button">手筋</button>
      <button class="tab" data-tab="senpou" type="button">戦法</button>
    </div>
    <p class="zukan-note" id="zukan-note"></p>
    <div id="zukan-list"></div>
  </section>
</div>

<!-- ============ 判定シート ============ -->
<div id="judge" hidden>
  <div class="judge-dim" id="judge-dim"></div>
  <div class="judge-sheet">
    <div class="judge-mark" id="judge-mark"><span class="mark">◯</span><span class="word" id="judge-word"></span></div>
    <div class="judge-answer" id="judge-answer"></div>
    <p class="judge-expl" id="judge-expl"></p>
    <button class="ghost-btn" id="btn-replay" type="button" hidden>▶ もういちど見る</button>
    <button class="next-btn" id="btn-next" type="button">つぎへ ▶</button>
  </div>
</div>

<script src="./core.js"></script>
<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
