<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ストレッチ ルーティン</title>
<meta name="description" content="毎日のストレッチを、順番どおりに進めるためのアプリ">
<meta name="theme-color" content="#efe1c1">
<!-- ホーム画面から独立したアプリとして開くための設定 (アドレスバーが消える) -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="./icon-512.png" type="image/png" sizes="512x512">
<!-- iOS は SVG を読めないので、ホーム画面用は PNG を渡す (make-icons.js で作る) -->
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- イラストの元。線画のピクトグラムを symbol にまとめておき、
     各画面では <use> で呼び出すだけにする(色はテーマの currentColor に追従)。 -->
<svg id="sprite" style="display:none" aria-hidden="true">
  <defs>

    <symbol id="iconWarmup" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="18" stroke="currentColor" stroke-width="6" fill="none"/>
      <g stroke="currentColor" stroke-width="6" stroke-linecap="round">
        <line x1="86" y1="60" x2="100" y2="60"/>
        <line x1="78.4" y1="41.6" x2="88.3" y2="31.7"/>
        <line x1="60" y1="34" x2="60" y2="20"/>
        <line x1="41.6" y1="41.6" x2="31.7" y2="31.7"/>
        <line x1="34" y1="60" x2="20" y2="60"/>
        <line x1="41.6" y1="78.4" x2="31.7" y2="88.3"/>
        <line x1="60" y1="86" x2="60" y2="100"/>
        <line x1="78.4" y1="78.4" x2="88.3" y2="88.3"/>
      </g>
    </symbol>

    <symbol id="iconComplete" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="34" stroke="currentColor" stroke-width="6" fill="none"/>
      <path d="M44,62 L56,74 L80,46" stroke="currentColor" stroke-width="8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 種目のピクトグラム。7種目とも同じ描き分けで描く:
           人   = 塗りつぶし (頭・胴体) + 太い線 (手足)。腕は必ず1本描く
           道具 = 濃い輪郭線 (使っているボール)
           家具 = 細く薄い線 (椅子・床)。これで椅子と体が混ざらない
         1つの種目は複数のコマでできている。既定は before (はじめの姿勢) と
         after (動いた先の姿勢) の2つ1組。左右に振る種目だけは
         center / left / right の3枚を使い、真ん中→左→真ん中→右 と回す
         (コマの並べ方は core.js の SWING_FRAMES が決める)。
         どのコマでも頭・胴体・家具は動かさず、手足とボールだけを動かして
         対にする — バラバラに描くと同じ人に見えなくなる。 -->

    <!-- 矢印。コマを切り替えず横に並べるとき (動きを減らす設定) だけ、
         コマとコマのあいだに置く -->
    <symbol id="iconArrow" viewBox="0 0 40 40">
      <path d="M4,20 L32,20 M22,10 L32,20 L22,30" stroke="currentColor" stroke-width="5"
        fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- 椅子。4つの座り種目で使い回す -->
    <g id="chairBase" stroke="currentColor" stroke-width="4" opacity=".45"
       fill="none" stroke-linecap="round">
      <line x1="10" y1="104" x2="110" y2="104"/>
      <line x1="34" y1="80" x2="84" y2="80"/>
      <line x1="34" y1="80" x2="34" y2="40"/>
      <line x1="38" y1="80" x2="36" y2="103"/>
      <line x1="80" y1="80" x2="82" y2="103"/>
    </g>

    <!-- 寝る面。椅子から背もたれを取った形。3つの寝る種目で使い回す。
         体はこの面の上に載せる (面から離すと宙に浮いて見える)。 -->
    <g id="bedBase" stroke="currentColor" stroke-width="4" opacity=".45"
       fill="none" stroke-linecap="round">
      <line x1="10" y1="104" x2="110" y2="104"/>
      <line x1="12" y1="88" x2="108" y2="88"/>
      <line x1="16" y1="88" x2="14" y2="103"/>
      <line x1="104" y1="88" x2="106" y2="103"/>
    </g>

    <!-- 0: 仰向けに寝て、膝を立てて (足首は床について動かさない)、
         膝だけを左右に振る。
         横から見ると膝の曲げ伸ばしに見えてしまうので、真上から見た構図にする:
         頭を上、体を縦に置く。股関節と足首の位置は before/after で変えず、
         膝の位置だけを横にずらして「く」の字に曲げる — 股関節から足首まで
         まっすぐ伸ばすと膝が外に流れるだけの動き(伸び縮み)に見えてしまう。
         before/after は「まん中→片側」ではなく「片側→反対側」の対にして、
         左右に振る範囲そのものを見せる。after は before を左右反転しただけ。
         before = 膝を右に振った姿勢
         after  = before を左右反転した、膝を左に振った姿勢 -->
    <g id="matTopBase" stroke="currentColor" stroke-width="4" opacity=".45"
       fill="none" stroke-linecap="round">
      <rect x="16" y="6" width="88" height="108" rx="12"/>
    </g>
    <symbol id="kneeFall-before" viewBox="0 0 120 120">
      <use href="#matTopBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="49" y1="42" x2="28" y2="52"/>
        <line x1="71" y1="42" x2="92" y2="52"/>
        <line x1="53" y1="70" x2="86" y2="86"/>
        <line x1="86" y1="86" x2="53" y2="100"/>
        <line x1="67" y1="70" x2="100" y2="86"/>
        <line x1="100" y1="86" x2="67" y2="100"/>
      </g>
      <circle cx="60" cy="20" r="11" fill="currentColor"/>
      <rect x="49" y="34" width="22" height="36" rx="11" fill="currentColor"/>
    </symbol>
    <symbol id="kneeFall-after" viewBox="0 0 120 120">
      <use href="#matTopBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="71" y1="42" x2="92" y2="52"/>
        <line x1="49" y1="42" x2="28" y2="52"/>
        <line x1="67" y1="70" x2="34" y2="86"/>
        <line x1="34" y1="86" x2="67" y2="100"/>
        <line x1="53" y1="70" x2="20" y2="86"/>
        <line x1="20" y1="86" x2="53" y2="100"/>
      </g>
      <circle cx="60" cy="20" r="11" fill="currentColor"/>
      <rect x="49" y="34" width="22" height="36" rx="11" fill="currentColor"/>
    </symbol>

    <!-- 1: 横向きに寝て、曲げた膝を開いて閉じる (クラムシェル)。前から見た構図。
         両膝を曲げて重ね、足先はそろえたまま、上の膝だけを天井へ開く。
         下の脚と足先は 2 コマとも動かさない。足先まで離すと
         「脚ごと持ち上げる」別の動きに見えるので、足先は必ずそろえる。
         before = 曲げた両膝を重ねた姿勢 / after = 上の膝を開いた姿勢 -->
    <symbol id="sideKnee-before" viewBox="0 0 120 120">
      <use href="#bedBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path class="legLower" d="M72 82 L92 74 L108 84"/>
        <path class="legUpper" d="M72 76 L92 66 L108 80"/>
        <line x1="38" y1="68" x2="16" y2="56"/>
      </g>
      <circle cx="20" cy="76" r="11" fill="currentColor"/>
      <rect x="32" y="68" width="42" height="16" rx="8" fill="currentColor"/>
    </symbol>
    <symbol id="sideKnee-after" viewBox="0 0 120 120">
      <use href="#bedBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path class="legLower" d="M72 82 L92 74 L108 84"/>
        <path class="legUpper" d="M72 75 L90 48 L108 80"/>
        <line x1="38" y1="68" x2="16" y2="56"/>
      </g>
      <circle cx="20" cy="76" r="11" fill="currentColor"/>
      <rect x="32" y="68" width="42" height="16" rx="8" fill="currentColor"/>
    </symbol>

    <!-- 2: 横向きに寝て、上の腕を伸ばして開く・閉じる。
         before = 腕を体に沿わせて下ろした姿勢
         after  = 腕を頭の上に伸ばして開いた姿勢 -->
    <symbol id="sideArm-before" viewBox="0 0 120 120">
      <use href="#bedBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="74" y1="78" x2="92" y2="82"/>
        <line x1="92" y1="82" x2="108" y2="86"/>
        <line x1="46" y1="66" x2="30" y2="90"/>
      </g>
      <circle cx="20" cy="76" r="11" fill="currentColor"/>
      <rect x="32" y="68" width="42" height="16" rx="8" fill="currentColor"/>
    </symbol>
    <symbol id="sideArm-after" viewBox="0 0 120 120">
      <use href="#bedBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="74" y1="78" x2="92" y2="82"/>
        <line x1="92" y1="82" x2="108" y2="86"/>
        <line x1="44" y1="68" x2="44" y2="36"/>
      </g>
      <circle cx="20" cy="76" r="11" fill="currentColor"/>
      <rect x="32" y="68" width="42" height="16" rx="8" fill="currentColor"/>
    </symbol>

    <!-- 3: 椅子に浅く座り、ボールを抱えて体をひねる。正面から見た構図
         (隣の「体を倒す」と同じ向き。以前は真上から見た絵で、並ぶと見え方が
         そろっていなかった)。
         脚・腰・椅子は正面を向いたまま動かさない (chairLeanLegs を共有)。
         胸から上だけがひねられ、抱えたボールが横へ回る。回した側の肩が
         奥へ入るので、胴は少し細く描く (24 → 20)。胴の前を横切る腕は
         カードの地色のふちで浮かせる (胴と同じ色なので、そのままだと消える)。
         頭は動かさず、symbol の直下に置く (頭の周りの見張りテストが探すため)。
         left / right は、隣の「倒す」と同じく画面の左 / 右へ回る向き。
         center = 正面でボールを抱えた姿勢 / left・right = 画面の左・右へひねった姿勢 -->
    <symbol id="chairTwist-center" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="48" y="38" width="24" height="42" rx="12" fill="currentColor"/><path d="M50 46 L45 62" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M70 46 L75 62" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="ball" cx="60" cy="64" r="15" stroke="currentColor" stroke-width="5"/>
    </symbol>
    <symbol id="chairTwist-left" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="50" y="38" width="20" height="42" rx="10" fill="currentColor"/><path d="M68 46 L66 56 L46 52" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 46 L58 58 L48 66" style="stroke: var(--bg-2)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 46 L58 58 L48 66" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="ball" cx="38" cy="60" r="14" stroke="currentColor" stroke-width="5"/>
    </symbol>
    <symbol id="chairTwist-right" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="50" y="38" width="20" height="42" rx="10" fill="currentColor"/><path d="M52 46 L54 56 L74 52" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 46 L62 58 L72 66" style="stroke: var(--bg-2)" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M68 46 L62 58 L72 66" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle class="ball" cx="82" cy="60" r="14" stroke="currentColor" stroke-width="5"/>
    </symbol>

    <!-- 4: 椅子に浅く座り、ボールを抱えて体を倒す。
         左右への傾きは真上からだと見えないので、正面から見た構図にする。
         脚と椅子は動かさず、腰から上だけを腰の位置を軸に傾ける。 -->
    <g id="chairFrontBase" stroke="currentColor" stroke-width="4" opacity=".45"
       fill="none" stroke-linecap="round">
      <line x1="14" y1="112" x2="106" y2="112"/>
      <line x1="32" y1="94" x2="88" y2="94"/>
      <line x1="36" y1="94" x2="34" y2="111"/>
      <line x1="84" y1="94" x2="86" y2="111"/>
    </g>
    <!-- 倒す中身。腰から上をひとまとめにして 3 つの姿勢で使い回す -->
    <g id="chairLeanBody">
      <circle cx="60" cy="24" r="11" fill="currentColor"/>
      <rect x="48" y="38" width="24" height="42" rx="12" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
        <line x1="50" y1="46" x2="45" y2="62"/>
        <line x1="70" y1="46" x2="75" y2="62"/>
      </g>
      <circle class="ball" cx="60" cy="64" r="15" stroke="currentColor" stroke-width="5"/>
    </g>
    <!-- 脚。倒しても動かさない -->
    <g id="chairLeanLegs" stroke="currentColor" stroke-width="6" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <line x1="53" y1="80" x2="53" y2="94"/>
      <line x1="67" y1="80" x2="67" y2="94"/>
    </g>
    <symbol id="chairLean-center" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/>
      <use href="#chairLeanLegs"/>
      <use href="#chairLeanBody"/>
    </symbol>
    <symbol id="chairLean-left" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/>
      <use href="#chairLeanLegs"/>
      <g transform="rotate(-25 60 80)"><use href="#chairLeanBody"/></g>
    </symbol>
    <symbol id="chairLean-right" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/>
      <use href="#chairLeanLegs"/>
      <g transform="rotate(25 60 80)"><use href="#chairLeanBody"/></g>
    </symbol>

    <!-- 5: 椅子に浅く座り、ボールを持って上げ下げする。
         before = ボールを胸の高さで持った姿勢
         after  = ボールを頭の上まで持ち上げた姿勢 -->
    <symbol id="chairLift-before" viewBox="0 0 120 120">
      <use href="#chairBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="62" y1="74" x2="88" y2="74"/>
        <line x1="88" y1="74" x2="88" y2="101"/>
        <line x1="88" y1="101" x2="97" y2="101"/>
        <line x1="62" y1="52" x2="78" y2="48"/>
      </g>
      <circle cx="62" cy="24" r="11" fill="currentColor"/>
      <rect x="54" y="35" width="16" height="41" rx="8" fill="currentColor"/>
      <circle cx="84" cy="46" r="14" stroke="currentColor" stroke-width="5" fill="none"/>
    </symbol>
    <symbol id="chairLift-after" viewBox="0 0 120 120">
      <use href="#chairBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="62" y1="74" x2="88" y2="74"/>
        <line x1="88" y1="74" x2="88" y2="101"/>
        <line x1="88" y1="101" x2="97" y2="101"/>
        <line x1="62" y1="42" x2="78" y2="30"/>
        <line x1="78" y1="30" x2="88" y2="24"/>
      </g>
      <circle cx="62" cy="24" r="11" fill="currentColor"/>
      <rect x="54" y="35" width="16" height="41" rx="8" fill="currentColor"/>
      <circle cx="96" cy="18" r="14" stroke="currentColor" stroke-width="5" fill="none"/>
    </symbol>

    <!-- 6: 椅子に浅く座り、トゲトゲボールを足で踏んで転がす。
         before = ボールを足もとに置いた姿勢
         after  = ボールを前へ転がした姿勢 -->
    <symbol id="footRoll-before" viewBox="0 0 120 120">
      <use href="#chairBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="62" y1="74" x2="84" y2="74"/>
        <line x1="84" y1="74" x2="84" y2="86"/>
        <line x1="62" y1="46" x2="66" y2="66"/>
      </g>
      <circle cx="62" cy="24" r="11" fill="currentColor"/>
      <rect x="54" y="35" width="16" height="41" rx="8" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round">
        <circle cx="78" cy="95" r="9"/>
        <line x1="87" y1="95" x2="92" y2="95"/>
        <line x1="69" y1="95" x2="64" y2="95"/>
        <line x1="84.4" y1="88.6" x2="87.9" y2="85.1"/>
        <line x1="71.6" y1="88.6" x2="68.1" y2="85.1"/>
        <line x1="84.4" y1="101.4" x2="87.9" y2="104.9"/>
        <line x1="71.6" y1="101.4" x2="68.1" y2="104.9"/>
      </g>
    </symbol>
    <symbol id="footRoll-after" viewBox="0 0 120 120">
      <use href="#chairBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <line x1="62" y1="74" x2="86" y2="74"/>
        <line x1="86" y1="74" x2="93" y2="84"/>
        <line x1="93" y1="86" x2="103" y2="86"/>
        <line x1="62" y1="46" x2="72" y2="66"/>
      </g>
      <circle cx="62" cy="24" r="11" fill="currentColor"/>
      <rect x="54" y="35" width="16" height="41" rx="8" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="5" fill="none" stroke-linecap="round">
        <circle cx="98" cy="95" r="9"/>
        <line x1="107" y1="95" x2="112" y2="95"/>
        <line x1="89" y1="95" x2="84" y2="95"/>
        <line x1="104.4" y1="88.6" x2="107.9" y2="85.1"/>
        <line x1="91.6" y1="88.6" x2="88.1" y2="85.1"/>
        <line x1="104.4" y1="101.4" x2="107.9" y2="104.9"/>
        <line x1="91.6" y1="101.4" x2="88.1" y2="104.9"/>
      </g>
    </symbol>


    <!-- 床。四つん這いの種目で使う -->
    <g id="floorBase" stroke="currentColor" stroke-width="4" opacity=".45"
       fill="none" stroke-linecap="round">
      <line x1="10" y1="106" x2="110" y2="106"/>
    </g>

    <!-- 壁と床。立ってやる種目で使う -->
    <g id="wallBase" stroke="currentColor" stroke-width="4" opacity=".45"
       fill="none" stroke-linecap="round">
      <line x1="100" y1="12" x2="100" y2="110"/>
      <line x1="14" y1="110" x2="106" y2="110"/>
    </g>

    <!-- 仰向けに寝て、片足を反対の足の上へ持っていく (腰をひねる)。
         真上から見た構図。肩は床につけたまま動かさず、渡る足だけが動く。
         「両脚をそろえたまま回す」のではなく、片足が反対の足を越えて渡るのが
         この種目の動き。動く前の足の位置を薄く残して、どこから来たかを見せる。
         上半身は kneeFall と同じ (頭・胴・腕)。腰を別の丸で描くと、ほかの
         仰向けの種目に無い塊がそこだけ目立つので描かない。脚は胴の下端から出す。
         渡る足は、まっすぐの脚とほぼ同じ長さ (36 前後) にしてある。
         before = 両足そろえた姿勢 / after = 片足が反対側へ渡った姿勢 -->
    <g id="hipTwistUpper">
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
        <line x1="49" y1="42" x2="28" y2="52"/>
        <line x1="71" y1="42" x2="92" y2="52"/>
      </g>
      <circle cx="60" cy="20" r="11" fill="currentColor"/>
      <rect x="49" y="34" width="22" height="36" rx="11" fill="currentColor"/>
    </g>
    <symbol id="hipTwist-before" viewBox="0 0 120 120">
      <use href="#matTopBase"/>
      <g stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round">
        <line x1="54" y1="70" x2="51" y2="106"/>
        <line x1="66" y1="70" x2="69" y2="106"/>

      <use href="#railBase"/><g stroke-width="7" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M52 70 L39.8 88.3 L36 110"/><path d="M64 70 L76.2 88.3 L80 110"/></g><rect x="47" y="32" width="22" height="42" rx="11" fill="currentColor"/><circle cx="58" cy="20" r="11" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M66 40 L83 50.6 L104 64"/><path d="M50 40 L38 62"/></g>
    </symbol>
    <symbol id="sumoSquat-after" viewBox="0 0 120 120">
      <use href="#railBase"/><g stroke-width="7" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M52 84 L30.5 88.7 L36 110"/><path d="M64 84 L85.5 88.7 L80 110"/></g><rect x="47" y="46" width="22" height="42" rx="11" fill="currentColor"/><circle cx="58" cy="34" r="11" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M66 54 L86 55.4 L104 64"/><path d="M50 54 L38 76"/></g>
    </symbol>

    <!-- 前にある何かにつかまり、お尻を後ろへ引くように腰を下げるスクワット。横から見た構図。
         足と手の位置は動かさない。上体は前へ倒れ、腕は伸びる。無理のない深さまで
         before = つかまって立った姿勢 / after = お尻を後ろへ引いて下げた姿勢 -->
    <symbol id="hipBackSquat-before" viewBox="0 0 120 120">
      <use href="#railBase"/><g stroke-width="7" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M60 66 L61.1 88 L62 110"/><path d="M60 66 L61.1 88 L62 110"/></g><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M60 110 L68 110"/><path d="M60 110 L68 110"/></g><line x1="60" y1="66" x2="61.8" y2="40.1" stroke="currentColor" stroke-width="20" stroke-linecap="round"/><circle cx="62.9" cy="24.1" r="11" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M62.1 36.1 L80.9 47.5 L104 62"/></g>
    </symbol>
    <symbol id="hipBackSquat-after" viewBox="0 0 120 120">
      <use href="#railBase"/><g stroke-width="7" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M46 80 L66.3 88.4 L62 110"/><path d="M46 80 L66.3 88.4 L62 110"/></g><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M60 110 L68 110"/><path d="M60 110 L68 110"/></g><line x1="46" y1="80" x2="58.2" y2="57" stroke="currentColor" stroke-width="20" stroke-linecap="round"/><circle cx="65.7" cy="42.9" r="11" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M60.1 53.5 L81.7 57.5 L104 62"/></g>
    </symbol>

    <!-- 椅子に座り、つま先立ちしながらお腹をへこませて骨盤を後ろへ倒す。
         足を下ろしながら骨盤を起こす。横から見た構図 (chairLift と同じ)
         before = かかとを下ろし骨盤を立てた姿勢 / after = つま先立ちで骨盤を後ろへ倒した姿勢 -->
    <symbol id="pelvisTilt-before" viewBox="0 0 120 120">
      <use href="#chairBase"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M62 76 L88 74 L88 101 L97 101"/></g><g transform="rotate(0 62 76)"><circle cx="62" cy="24" r="11" fill="currentColor"/><rect x="54" y="35" width="16" height="41" rx="8" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M62 46 L74 66"/></g></g>
    </symbol>
    <symbol id="pelvisTilt-after" viewBox="0 0 120 120">
      <use href="#chairBase"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M62 76 L88 70 L92 96 L100 103"/></g><g transform="rotate(-14 62 76)"><circle cx="62" cy="24" r="11" fill="currentColor"/><rect x="54" y="35" width="16" height="41" rx="8" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M62 46 L74 66"/></g></g>
    </symbol>

    <!-- 座って腕を斜め下へ開き、腕を外へ回しながら後ろへ開く。肩甲骨を意識する。
         正面から見た構図。肘は伸ばしたまま。親指の向きを短い線で添え、
         内向き → 外向きに回ったことを見せる
         before = 腕を斜めに開いた姿勢 / after = 腕を外へ回して後ろへ開いた姿勢 -->
    <symbol id="armOpen-before" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="48" y="38" width="24" height="42" rx="12" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M50 44 L34 70"/><path d="M70 44 L86 70"/></g><line x1="34" y1="70" x2="39" y2="74" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><line x1="86" y1="70" x2="81" y2="74" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="armOpen-after" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="48" y="38" width="24" height="42" rx="12" fill="currentColor"/><path d="M50 44 L34 70" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" opacity=".25"/><path d="M70 44 L86 70" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round" opacity=".25"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M50 44 L24 64"/><path d="M70 44 L96 64"/></g><line x1="24" y1="64" x2="18" y2="61" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><line x1="96" y1="64" x2="102" y2="61" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
    </symbol>

    <!-- 座って肘を脇につけたまま、前腕を外へ回して開く。肩甲骨を意識する。
         正面から見た構図。肘の位置は動かさない。前に向けた前腕は
         正面からは短く見え、外へ回すと横に伸びて見える
         before = 前腕を前へ向けた姿勢 / after = 前腕を外へ開いた姿勢 -->
    <symbol id="armRotate-before" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="48" y="38" width="24" height="42" rx="12" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M50 44 L46 66 L54 72"/><path d="M70 44 L74 66 L66 72"/></g>
    </symbol>
    <symbol id="armRotate-after" viewBox="0 0 120 120">
      <use href="#chairFrontBase"/><use href="#chairLeanLegs"/><circle cx="60" cy="24" r="11" fill="currentColor"/><rect x="48" y="38" width="24" height="42" rx="12" fill="currentColor"/><g stroke-width="6" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M50 44 L46 66 L26 62"/><path d="M70 44 L74 66 L94 62"/></g>
    </symbol>

  </defs>
</svg>

<div id="app">
  <header id="topbar">
    <h1 class="title">STRETCH ROUTINE</h1>
    <div class="topbar-actions">
      <button type="button" id="btnRestart" class="btn">はじめから</button>
    </div>
  </header>

  <main id="stage">

    <section id="screenWarmup" class="screen">
      <!-- アプリの人。飾りがつくので <use> ではなく app.js が直に組み立てる
           (<use> の中身は影の木に入り、外から一部だけ出し入れできない) -->
      <svg class="illustration mascot" id="mascot" viewBox="0 0 120 120" aria-hidden="true"></svg>
      <!-- 色の丸。WARM UP の札があった場所に置く (縦の短い画面で
           「はじめる」を押し出さないよう、1 段ぶんの場所を入れ替えた) -->
      <div class="swatches" id="swatches" role="group" aria-label="いろ"></div>
      <p class="lead" id="warmupText">—</p>

      <!-- スタンプカード。1 周やりきるごとに 1 個たまる -->
      <div class="stampCard">
        <p class="stampHead">
          <span>STAMP CARD</span>
          <span id="cardCount" class="stampCount">—</span>
        </p>
        <div class="stampSlots" id="stampSlots" aria-hidden="true"></div>
        <p class="stampNote" id="stampNote" aria-live="polite">—</p>
      </div>

      <!-- 途中でやめていたときだけ「つづきから」が出る。
           出ているあいだは、そちらを主なボタンにする -->
      <div class="actions">
        <button type="button" id="btnCustom" class="btn" hidden>きせかえ</button>
        <button type="button" id="btnStart" class="btn btn-primary">はじめる</button>
        <button type="button" id="btnResume" class="btn btn-primary" hidden>つづきから</button>
      </div>
    </section>

    <section id="screenCustom" class="screen" hidden>
      <svg class="illustration mascot" id="mascotPreview" viewBox="0 0 120 120" aria-hidden="true"></svg>
      <p class="badge">CUSTOM</p>
      <div class="customGroup">
        <p class="customLabel">いろ</p>
        <div class="chips" id="skinChips"></div>
      </div>
      <div class="customGroup">
        <p class="customLabel">かざり</p>
        <div class="chips" id="gearChips"></div>
      </div>
      <button type="button" id="btnCloseCustom" class="btn btn-primary">とじる</button>
    </section>

    <section id="screenRun" class="screen" hidden>
      <!-- 中身は app.js が種目のコマ割りに合わせて組み立てる (2 コマとは限らない) -->
      <div class="illustrationRow" id="illustrationRow" aria-hidden="true"></div>
      <p class="progress" id="progress">— / —</p>
      <!-- バーは「6 / 10」の文字と同じことを絵で見せるだけなので、
           読み上げからは外す (二重に読まれるのを防ぐ)。 -->
      <div class="progressBar" aria-hidden="true">
        <div class="progressBarFill" id="progressBarFill"></div>
      </div>
      <!-- 種目が変わったことを読み上げに知らせる。ボタンまで含めると
           押すたびに全部読まれてうるさいので、変わる中身だけを囲う。 -->
      <div class="stepInfo" aria-live="polite">
        <p class="exerciseName" id="exerciseName">—</p>
        <p class="side" id="side">—</p>
        <p class="reps"><span id="reps">—</span><span class="repsUnit" id="repsUnit">回</span></p>
      </div>
      <div class="actions">
        <button type="button" id="btnBack" class="btn">もどる</button>
        <button type="button" id="btnDone" class="btn btn-primary">できた</button>
      </div>
    </section>

    <section id="screenDone" class="screen" hidden>
      <svg class="illustration" aria-hidden="true"><use href="#iconComplete"></use></svg>
      <p class="badge">COMPLETE</p>
      <p class="lead">おつかれさまでした。</p>
      <button type="button" id="btnAgain" class="btn btn-primary">もう一度</button>
    </section>

  </main>
</div>

<script src="./core.js"></script>
<script src="./app.js"></script>
</body>
</html>
